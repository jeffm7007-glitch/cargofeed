name: refresh-feed
on:
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and rebuild
        run: python3 fetch_feeds.py
      - name: Commit if changed
        run: |
          git config user.name "cargofeed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feed refresh [skip ci]"
            git push
          fi
